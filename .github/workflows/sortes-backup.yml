# Live daily production backup (GitHub Actions fallback).
# Installed 2026-11-08 after the `workflow` scope was granted to the
# pushing token. The VM-direct pg_dump path is blocked by a runtime
# permission, so this runner-based backup is the production backup
# until that permission is enabled. Needs repo secret
# SORTES_BACKUP_DATABASE_URL and repo variable AGE_PUBLIC_KEY.
# See docs/BACKUP-RECOVERY.md. Backup lands as a GitHub artifact
# (14-day retention), encrypted with age.
name: 'Daily production backup (fallback)'

on:
  schedule:
    - cron: '7 19 * * *' # 03:07 Asia/Manila
  workflow_dispatch:
  # Temporary push trigger (transformation branch only) so the first
  # backup can run before this file is merged to main: workflow_dispatch
  # and schedule only fire when the file exists on the default branch.
  # Remove this push block in the Phase H merge cleanup once the file
  # is on main and the schedule takes over.
  push:
    branches:
      - sortes-transformation-2026-11-05
    paths:
      - .github/workflows/sortes-backup.yml
      - scripts/backup.mjs

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age postgresql-client

      - name: Validate secrets and variables
        run: |
          if [ -z "${SORTES_BACKUP_DATABASE_URL:-}" ]; then
            echo "::error::Secret SORTES_BACKUP_DATABASE_URL is not set or empty."
            exit 1
          fi
          if [ -z "${SORTES_BACKUP_AGE_RECIPIENT:-}" ]; then
            echo "::error::Variable AGE_PUBLIC_KEY is not set or empty."
            exit 1
          fi
        env:
          SORTES_BACKUP_DATABASE_URL: ${{ secrets.SORTES_BACKUP_DATABASE_URL }}
          SORTES_BACKUP_AGE_RECIPIENT: ${{ vars.AGE_PUBLIC_KEY }}

      - name: Run backup
        env:
          SORTES_BACKUP_DATABASE_URL: ${{ secrets.SORTES_BACKUP_DATABASE_URL }}
          SORTES_BACKUP_PRODUCTION: '1'
          SORTES_BACKUP_ALLOW_REMOTE: '1'
          SORTES_BACKUP_DIR: ${{ runner.temp }}/sortes-backups
          SORTES_BACKUP_KEEP: '1'
          SORTES_BACKUP_AGE_RECIPIENT: ${{ vars.AGE_PUBLIC_KEY }}
        run: node scripts/backup.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sortes-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/sortes-backups/sortes-*.dump.age
          retention-days: 14
